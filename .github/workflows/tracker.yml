name: tracker

# Regenerates the repository completion tracker in docs/index.html from the live
# state of the four canonical organizations, and opens a pull request when the
# page has fallen behind. The page is never edited by hand, so this keeps the
# published portal honest about what has actually shipped.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Regenerate the tracker
        env:
          # GITHUB_TOKEN reads the public repositories of the four organizations.
          # Set OPENOODA_GH_TOKEN to a read-scoped PAT to use it instead.
          GH_TOKEN: ${{ secrets.OPENOODA_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: .github/scripts/tracker.sh

      - name: Open a pull request when the page has drifted
        env:
          GH_TOKEN: ${{ secrets.OPENOODA_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/index.html; then
            echo "tracker: docs/index.html already matches the live repository state"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B feature/tracker-refresh
          git add docs/index.html
          git commit -m "docs: refresh the repository completion tracker"
          git push --force origin feature/tracker-refresh
          gh pr create \
            --base master \
            --head feature/tracker-refresh \
            --title "docs: refresh the repository completion tracker" \
            --body "Automated refresh of the repository completion tracker and the live version claims on \`docs/index.html\`.

            Regenerated by \`.github/scripts/tracker.sh\` from the live state of the four canonical organizations. See \`README.md\` for the gate and tier definitions."
        continue-on-error: true
