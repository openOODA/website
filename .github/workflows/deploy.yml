name: Deploy openOODA website to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ooda toolchain
        run: |
          curl -fsSL https://openooda.org/install.sh -o /tmp/install.sh
          bash /tmp/install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build site
        run: ooda run scripts/site_build_fresh.oo
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: "true"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
