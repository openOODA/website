name: Deploy openOODA website to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  static-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: site
      - name: static site gate
        working-directory: site
        run: |
          set -euo pipefail
          test -d docs && cd docs
          test -f index.html
          test -f CNAME
          test -f .nojekyll
          grep -qx 'openooda.org' CNAME
          sh -n install.sh
          grep -oE '(src|href)="[^"]+"' index.html \
            | sed -E 's/^(src|href)="([^"]+)".*/\2/' \
            | grep '^/' \
            | while read -r ref; do
                test -f ".$ref" || { echo "ERR broken asset ref: $ref"; exit 1; }
              done
          if find . -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.svg' \) \
              -exec grep -liE 'cloudflareinsights|google-analytics|googletagmanager|mixpanel|sentry\.io|telemetry_upload' {} + | grep .; then
            echo "ERR third-party telemetry beacon in published tree"
            exit 1
          fi
          if grep -oE 'src="(https?:)?//[^"]+"' index.html | grep . \
              || grep -oE "<link[^>]*href=\"(https?:)?//" index.html | grep .; then
            echo "ERR remote subresource ref in index.html"
            exit 1
          fi
          echo "[static-gate OK] docs/ is a self-contained zero-telemetry webroot"

  deploy:
    needs: static-gate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: site
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: "true"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/docs
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
