name: Deploy openOODA website to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: site
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA-core/oodac
          path: oodac
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA-core/std
          path: std
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA-core/oodar
          path: oodar
      - name: clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: build oodar libs
        run: make -C oodar/scripts -f Makefile modular
      - name: Run the zero-trust privacy gate
        working-directory: site
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_SITE_ROOT: ${{ github.workspace }}/site
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
        run: |
          test -x ../oodac/bin/oodac || chmod +x ../oodac/bin/oodac
          "${OODA_COMPILER}" build tests/privacy_test.oo -o /tmp/privacy_test
          "/tmp/privacy_test"
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: "true"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
