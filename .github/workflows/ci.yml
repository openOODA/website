name: ci

on:
  workflow_dispatch:

jobs:
  static-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout website
        uses: actions/checkout@v4
        with:
          path: site
      - name: static site gate
        working-directory: site
        run: |
          set -euo pipefail
          # 8-entry repo root: at most 8 non-hidden entries at root.
          n=$(find . -maxdepth 1 -mindepth 1 ! -name '.*' | wc -l)
          test "$n" -le 8 || { echo "ERR root entries=$n > 8"; exit 1; }
          test -d docs && cd docs
          test -f index.html
          test -f CNAME
          test -f install.sh
          test -f .nojekyll
          test -d assets
          test -d styles
          test -d js
          grep -qx 'openooda.org' CNAME
          sh -n install.sh
          # Every local src/href in index.html must resolve under docs/ (the webroot).
          grep -oE '(src|href)="[^"]+"' index.html \
            | sed -E 's/^(src|href)="([^"]+)".*/\2/' \
            | grep '^/' \
            | while read -r ref; do
                test -f ".$ref" || { echo "ERR broken asset ref: $ref"; exit 1; }
              done
          # All 9 org icons ship as SVG + PNG.
          for o in openOODA openOODA-core openOODA-kernel openOODA-OS openOODA-tools openOODA-DE openOODA-apps openOODA-cloud openOODA-agents; do
            test -f "assets/brand/$o.svg" || { echo "ERR missing $o.svg"; exit 1; }
            test -f "assets/brand/$o.png" || { echo "ERR missing $o.png"; exit 1; }
          done
          # Zero hardcoded node names / tailnet addresses (fleet law).
          if grep -rniE 'ringmaster|spotlight|zebes|100\.[0-9]+\.[0-9]+\.[0-9]+' .; then
            echo "ERR hardcoded node reference in published tree"
            exit 1
          fi
          echo "[static OK] index.html assets resolve; CNAME + icons + no-node laws hold"
