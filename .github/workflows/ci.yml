name: ci

on:
  workflow_dispatch:
jobs:
  static-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout website
        uses: actions/checkout@v4
        with:
          path: site
      - name: checkout oodac
        uses: actions/checkout@v4
        with:
          repository: openOODA-core/oodac
          path: oodac
      - name: checkout std
        uses: actions/checkout@v4
        with:
          repository: openOODA-core/std
          path: std
      - name: checkout oodar
        uses: actions/checkout@v4
        with:
          repository: openOODA-core/oodar
          path: oodar
      - name: clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: build oodar libs
        run: make -C oodar/scripts -f Makefile modular
      - name: build and run .oo site gates
        working-directory: site
        env:
          OODA_COMPILER: ${{ github.workspace }}/oodac/bin/oodac
          OODA_SITE_ROOT: ${{ github.workspace }}/site
          OODA_FS_READDIR: ${{ github.workspace }}
          OODA_FS_WRITEDIR: ${{ github.workspace }}
          OODA_NO_JAIL: '1'
        run: |
          test -x ../oodac/bin/oodac || chmod +x ../oodac/bin/oodac
          for page in copy hooks layout links privacy shim; do
            "${OODA_COMPILER}" build "tests/${page}_test.oo" -o "/tmp/${page}_test"
            "/tmp/${page}_test"
          done
          "${OODA_COMPILER}" build src/json_test.oo -o /tmp/json_test
          "/tmp/json_test"
          "${OODA_COMPILER}" build tests/test_website.oo -o /tmp/test_website
          "/tmp/test_website"
          "${OODA_COMPILER}" build tests/contract/contract_test.oo -o /tmp/contract_test
          "/tmp/contract_test"
          "${OODA_COMPILER}" build tests/routes/routes_test.oo -o /tmp/routes_test
          "/tmp/routes_test"
          OODA_SITE_ROOT="$PWD" "${OODA_COMPILER}" build tests/shim/shim_trust_test.oo -o /tmp/shim_trust_test
          OODA_SITE_ROOT="$PWD" "/tmp/shim_trust_test"

  auto-release:
    needs: [static-test]
    uses: openOODA/openOODA/.github/workflows/auto-release.yml@v2.10.44
